<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missão Matemática — revisão prova 24/08</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17324a; --ink-soft:#4b6480; --paper:#fdfaf3; --grid:#cfe3e8;
  --mint:#2fae94; --mint-soft:#e3f5f0; --coral:#f2604c; --coral-soft:#fde7e3;
  --sun:#ffc857; --sun-soft:#fff2d3; --violet:#7a6cf0; --violet-soft:#eceaff;
  --line:#dfd8c8;
}
*{box-sizing:border-box;}
body{
  margin:0; padding:18px 14px 60px;
  font-family:'Nunito',system-ui,sans-serif; color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px; background-position:-1px -1px; min-height:100vh;
}
.wrap{max-width:700px;margin:0 auto;}
.card{background:#fffdf8;border:1.5px solid var(--line);border-radius:16px;
  box-shadow:0 10px 0 -6px rgba(23,50,74,.07),0 18px 40px -26px rgba(23,50,74,.55);padding:24px 20px;}
h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.9rem;line-height:1.1;margin:0 0 6px;}
h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.35rem;margin:0 0 10px;}
h3{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.02rem;margin:20px 0 8px;}
p{line-height:1.65;margin:0 0 12px;}
.eyebrow{font-family:'Fredoka',sans-serif;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mint);font-weight:600;margin:0 0 12px;}
.muted{color:var(--ink-soft);}
mark{background:linear-gradient(transparent 60%,var(--sun) 60%);padding:0 2px;color:inherit;}
button{font-family:inherit;cursor:pointer;}
.btn{border:none;background:var(--coral);color:#fff;font-family:'Fredoka',sans-serif;font-weight:600;
  font-size:1.02rem;padding:12px 24px;border-radius:999px;box-shadow:0 4px 0 #cf4735;
  transition:transform .08s,box-shadow .08s;}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #cf4735;}
.btn.mint{background:var(--mint);box-shadow:0 4px 0 #23856f;}
.btn.ghost{background:transparent;color:var(--ink-soft);box-shadow:none;border:1.5px solid var(--line);}
.btn.small{font-size:.9rem;padding:8px 16px;}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--sun);outline-offset:3px;}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;background:#fffdf8;border:1.5px solid var(--line);
  border-radius:14px;padding:10px 14px;margin-bottom:16px;flex-wrap:wrap;}
.hud .lvl{font-family:'Fredoka',sans-serif;font-size:.9rem;color:var(--ink);white-space:nowrap;}
.hud .xpbar{flex:1;min-width:120px;height:12px;background:#fff;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;}
.hud .xpfill{height:100%;width:0;background:linear-gradient(90deg,#57c9b1,var(--mint));transition:width .5s cubic-bezier(.3,1.4,.5,1);}
.hud .xpnum{font-family:'Fredoka',sans-serif;font-size:.85rem;color:var(--mint);white-space:nowrap;}
.medals{display:flex;gap:4px;font-size:1.05rem;}
.medals span{opacity:.22;filter:grayscale(1);transition:opacity .3s,filter .3s;}
.medals span.on{opacity:1;filter:none;}
.streak{font-family:'Fredoka',sans-serif;font-size:.85rem;color:var(--coral);white-space:nowrap;}

/* mapa */
.mods{display:flex;flex-direction:column;gap:10px;margin:18px 0 0;}
.mod{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;
  border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;transition:transform .1s,border-color .12s;}
.mod:hover:not(:disabled){transform:translateX(3px);border-color:var(--mint);}
.mod:disabled{opacity:.5;cursor:not-allowed;}
.mod .ic{flex:0 0 42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:var(--mint-soft);}
.mod.done .ic{background:var(--sun-soft);}
.mod .tt{font-family:'Fredoka',sans-serif;font-size:1.05rem;font-weight:600;}
.mod .st{font-size:.85rem;color:var(--ink-soft);}
.mod .badge{margin-left:auto;font-size:1.3rem;}

/* aula */
.lesson-box{background:var(--violet-soft);border-left:5px solid var(--violet);border-radius:12px;padding:14px 16px;margin:14px 0;}
.lesson-box strong{font-family:'Fredoka',sans-serif;}
.tool{background:#fff;border:1.5px dashed var(--mint);border-radius:14px;padding:16px 14px;margin:14px 0;}
.tool-hint{font-size:.85rem;color:var(--ink-soft);text-align:center;margin:10px 0 0;}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0;}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;
  font-weight:700;font-size:.92rem;color:var(--ink);transition:background .12s,border-color .12s;}
.chip:hover{border-color:var(--mint);background:var(--mint-soft);}
.chip.active{background:var(--mint);border-color:var(--mint);color:#fff;}
.readout{font-family:'Fredoka',sans-serif;font-size:1.5rem;text-align:center;margin:10px 0;letter-spacing:.02em;}
.readout small{font-family:'Nunito';font-size:.85rem;color:var(--ink-soft);display:block;font-weight:600;letter-spacing:0;}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.tag{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9a6a10;
  background:var(--sun-soft);border-radius:6px;padding:4px 9px;}
.dots{display:flex;gap:5px;}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block;}
.dots i.on{background:var(--mint);}
.dots i.now{background:var(--coral);transform:scale(1.25);}
.question{font-size:1.18rem;line-height:1.5;font-weight:700;margin:8px 0 16px;}
.opts{display:flex;flex-direction:column;gap:9px;}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:#fff;
  border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;font-weight:600;
  color:var(--ink);transition:border-color .12s,background .12s,transform .08s;}
.opt:hover:not(:disabled){border-color:var(--mint);transform:translateX(2px);}
.opt:disabled{cursor:default;}
.opt .letter{flex:0 0 28px;height:28px;border-radius:8px;background:var(--mint-soft);color:#1d7a66;
  font-family:'Fredoka',sans-serif;display:grid;place-items:center;font-size:.92rem;}
.opt.correct{border-color:var(--mint);background:var(--mint-soft);}
.opt.correct .letter{background:var(--mint);color:#fff;}
.opt.wrong{border-color:var(--coral);background:var(--coral-soft);}
.opt.wrong .letter{background:var(--coral);color:#fff;}
.opt.dim{opacity:.45;}
.feedback{margin-top:14px;border-radius:12px;padding:13px 15px;font-size:.97rem;line-height:1.6;display:none;}
.feedback.show{display:block;}
.feedback.ok{background:var(--mint-soft);border-left:5px solid var(--mint);}
.feedback.no{background:var(--coral-soft);border-left:5px solid var(--coral);}
.feedback strong{font-family:'Fredoka',sans-serif;display:block;margin-bottom:4px;}
.xpop{font-family:'Fredoka',sans-serif;color:var(--mint);font-size:.9rem;margin-top:6px;display:block;}
.rowend{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.hintbox{background:var(--sun-soft);border-radius:10px;padding:11px 14px;font-size:.93rem;margin-top:12px;display:none;line-height:1.55;}
.hintbox.show{display:block;}

/* resultado */
.big{font-family:'Fredoka',sans-serif;font-size:3.2rem;line-height:1;margin:6px 0;}
.review-item{background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--coral);
  border-radius:10px;padding:11px 13px;margin-bottom:9px;font-size:.93rem;line-height:1.55;}
.review-item b{font-family:'Fredoka',sans-serif;}
.hidden{display:none;}
.center{text-align:center;}
/* cartão de regra sempre à mão */
.rulecard{background:var(--violet-soft);border-radius:12px;padding:0 14px;margin:6px 0 14px;border-left:5px solid var(--violet);}
.rulecard summary{cursor:pointer;font-family:'Fredoka',sans-serif;font-size:.95rem;padding:11px 0;list-style:none;}
.rulecard summary::-webkit-details-marker{display:none;}
.rulecard summary::after{content:'▾';float:right;transition:transform .2s;}
.rulecard[open] summary::after{transform:rotate(180deg);}
.rulecard .rtext{font-size:.95rem;line-height:1.6;padding-bottom:12px;}
/* andaime: quebrar em partes */
.stepbox{margin-top:12px;display:none;}
.stepbox.show{display:block;}
.stepline{background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--violet);border-radius:10px;
  padding:11px 13px;margin-bottom:8px;font-size:.95rem;line-height:1.55;}
.stepline b{font-family:'Fredoka',sans-serif;color:var(--violet);}
/* opção escolhida, ainda não confirmada */
.opt.chosen{border-color:var(--violet);background:var(--violet-soft);border-width:2.5px;}
.opt.chosen .letter{background:var(--violet);color:#fff;}
/* passos da aula */
.stepdots{display:flex;gap:6px;justify-content:center;margin-bottom:14px;}
.stepdots i{width:26px;height:5px;border-radius:3px;background:var(--line);display:block;}
.stepdots i.on{background:var(--mint);}
.lesson-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;}
/* quem está estudando: informação de rodapé, não elemento de jogo */
.quemlinha{font-size:.85rem;color:var(--ink-soft);margin:16px 0 0;display:flex;
  align-items:center;gap:8px;flex-wrap:wrap;}
.quemlinha .btn{font-size:.75rem;padding:4px 11px;}
/* saída para o mapa: discreta de propósito, para ser porta e não convite */
.navtop{margin:-4px 0 10px;}
.navtop .btn{font-size:.82rem;padding:6px 13px;}
/* modo foco: menos estímulo concorrente */
body.focus{background-image:none;background-color:#fbfaf7;}
body.focus .card{box-shadow:0 1px 3px rgba(23,50,74,.08);}
body.focus .btn{box-shadow:none;}
body.focus .pop{animation:none;}
.toggle{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;
  font-size:.8rem;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
.toggle.on{background:var(--violet);border-color:var(--violet);color:#fff;}
.shield{font-size:.85rem;font-family:'Fredoka',sans-serif;color:var(--violet);white-space:nowrap;}
/* pausa sugerida */
.pausebox{background:var(--violet-soft);border-radius:14px;padding:16px;margin:18px 0 4px;text-align:center;}
.pausebox strong{font-family:'Fredoka',sans-serif;display:block;font-size:1.05rem;margin-bottom:6px;}
.clock{font-family:'Fredoka',sans-serif;font-size:2.4rem;color:var(--violet);margin:8px 0;}
figure.chart{margin:0 0 14px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 10px 6px;}
figure.chart figcaption{font-size:.83rem;color:var(--ink-soft);text-align:center;margin-top:4px;font-weight:600;}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1);}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.confetti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:99;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
@media (max-width:480px){h1{font-size:1.55rem}.question{font-size:1.06rem}.card{padding:18px 15px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script id="prova-data" type="application/json">
{"prova_id":"2026-08-MAT-Y5","titulo":"Missão Matemática — revisão prova 24/08","materia":"Matemática","alunas":["Alicia","Marco (teste)"],"escola":"Pueri Domus","ano_aluna":"Y5","nivel_conteudo":"Y5","bimestre":"3","contexto":"prova","criado_em":"2026-08-24","origem":"Roteiro da professora (foto) + livro Unique/Conexia Year 5","missoes":[{"missao_id":"grafico","icone":"📊","titulo":"Ler gráficos","subtitulo":"Tirar informação de um desenho","eixo":"Probabilidade e Estatística","tema_id":"MAT.EST.GRAF","subtema":"Leitura e interpretação de gráficos","habilidade_bncc":"EF05MA25","ferramenta":"grafico","regra":"\"Quantos <b>a mais</b>\" = subtração.<br>\"Que <b>parte do total</b>\" = aquele valor ÷ soma de todas as barras.","aula":{"corpo":"<p>Gráfico é uma tabela disfarçada de desenho. Antes de responder qualquer coisa, faça sempre estas três leituras:</p>\n  <div class=\"lesson-box\"><strong>1.</strong> O que está escrito embaixo de cada barra? (os grupos)<br>\n  <strong>2.</strong> O que a linha de números do lado esquerdo mede? (a quantidade)<br>\n  <strong>3.</strong> O que exatamente a pergunta quer: um valor, uma <i>diferença</i>, um total ou uma fração?</div>\n  <p>\"Quantos <b>a mais</b>\" é sempre <mark>subtração</mark> — nunca soma. Já \"que parte do total\" pede a fração daquele valor sobre a soma de todas as barras.</p>\n  <h3>Ferramenta 7 · Gráfico que responde</h3>","fechamento":"<div class=\"lesson-box\"><strong>Dica de prova</strong> Anote os valores das barras no rascunho antes de calcular. Erro mais comum não é a conta: é ler a barra errada.</div>"},"questoes":[{"questao_id":"MAT.EST.GRAF.Q1","enunciado":"Quantos livros <mark>a mais</mark> Alicia leu em junho em comparação com maio?","figura":{"tipo":"barras","fonte":"missao"},"alternativas":["7","15","4","11"],"correta":0,"dificuldade":1,"tipo_raciocinio":"interpretacao","dica":"Junho = 11 e maio = 4. 'Quantos a mais' pede subtração.","explicacao":"Junho = 11, maio = 4. A diferença é 11 − 4 = 7 livros."},{"questao_id":"MAT.EST.GRAF.Q2","enunciado":"Se a meta era ler <mark>8 livros por mês</mark>, em quantos meses Alicia ficou <b>abaixo</b> da meta?","figura":{"tipo":"barras","fonte":"missao"},"alternativas":["1","2","3","4"],"correta":1,"dificuldade":2,"tipo_raciocinio":"interpretacao","dica":"Compare cada barra com o 8. Março tem 6… e maio?","explicacao":"Março (6) e maio (4) ficaram abaixo de 8. Abril (9), junho (11) e julho (10) passaram da meta. Portanto, 2 meses."},{"questao_id":"MAT.EST.GRAF.Q3","enunciado":"Que <mark>fração do total</mark> de livros do período foi lida em julho?","figura":{"tipo":"barras","fonte":"missao"},"alternativas":["1/5","1/10","1/4","1/3"],"correta":2,"dificuldade":3,"tipo_raciocinio":"multi-etapa","dica":"Some todas as barras para achar o total. Depois monte a fração julho/total e simplifique.","explicacao":"Total = 6 + 9 + 4 + 11 + 10 = 40 livros. Julho teve 10. Então 10/40, que simplificado é 1/4.","passos":["Some todas as barras para achar o total de livros.","Quantos livros foram lidos em julho?","Monte a fração julho ÷ total e simplifique."]}],"dados":{"titulo":"Livros lidos por Alicia em cada mês","rotulo_x":"mês","rotulo_y":"livros","serie":[["Mar",6],["Abr",9],["Mai",4],["Jun",11],["Jul",10]]}},{"missao_id":"area","icone":"📐","titulo":"Área e perímetro","subtitulo":"A cerca e o piso","eixo":"Grandezas e Medidas","tema_id":"MAT.GEO.AREAPER","subtema":"Área e perímetro","habilidade_bncc":"EF05MA19","ferramenta":"area","regra":"<b>Perímetro</b> = a cerca (soma dos lados) → cm<br> <b>Área</b> = o piso (base × altura) → cm²","aula":{"corpo":"<p>São duas medidas bem diferentes e é fácil trocar uma pela outra. Use esta imagem:</p>\n  <div class=\"lesson-box\"><strong>Perímetro</strong> é a <mark>cerca</mark> em volta do terreno: soma dos lados. Mede-se em cm, m…<br><br>\n  <strong>Área</strong> é o <mark>piso</mark> que preenche o terreno: base × altura. Mede-se em cm², m² (o \"²\" é a pista!).</div>\n  <h3>Ferramenta 6 · Retângulo que você comanda</h3>","fechamento":"<div class=\"lesson-box\"><strong>Questão clássica</strong> \"O perímetro é 26 cm e um lado é 9 cm.\" Dois lados de 9 já usam 18. Sobram 8 para os outros dois lados, ou seja, 4 cada. Aí a área sai fácil.</div>"},"questoes":[{"questao_id":"MAT.GEO.AREAPER.Q1","enunciado":"Um retângulo tem <mark>perímetro de 26 cm</mark> e um dos lados mede 9 cm. Qual é a sua área?","figura":null,"alternativas":["117 cm²","54 cm²","72 cm²","36 cm²"],"correta":3,"dificuldade":3,"tipo_raciocinio":"multi-etapa","dica":"Dois lados de 9 cm somam 18. Quanto sobra do perímetro para os outros dois lados?","explicacao":"Dois lados de 9 cm = 18 cm. Sobram 26 − 18 = 8 cm para os outros dois, ou seja, 4 cm cada. Área = 9 × 4 = 36 cm².","passos":["Dois lados medem 9 cm cada. Quanto eles somam juntos?","O perímetro todo é 26. Quanto sobra para os outros dois lados?","Divida essa sobra por 2 para achar cada lado.","Agora a área: 9 × esse lado."]},{"questao_id":"MAT.GEO.AREAPER.Q2","enunciado":"Um quadrado tem <mark>área de 64 cm²</mark>. Qual é o seu perímetro?","figura":null,"alternativas":["32 cm","64 cm","16 cm","256 cm"],"correta":0,"dificuldade":2,"tipo_raciocinio":"conceitual","dica":"No quadrado todos os lados são iguais. Que número multiplicado por ele mesmo dá 64?","explicacao":"Se lado × lado = 64, o lado é 8 cm (8 × 8 = 64). Perímetro = 8 × 4 = 32 cm."},{"questao_id":"MAT.GEO.AREAPER.Q3","enunciado":"A figura abaixo é um retângulo de 6 cm por 4 cm com um quadradinho de 2 cm de lado <mark>recortado</mark> do canto. Qual é a área que sobrou?","figura":{"tipo":"svg","conteudo":"<svg viewBox=\"0 0 260 150\" width=\"100%\" role=\"img\" aria-label=\"retângulo com canto recortado\"> <path d=\"M20 20 H200 V70 H150 V130 H20 Z\" fill=\"#e3f5f0\" stroke=\"#2fae94\" stroke-width=\"2.5\"/> <path d=\"M150 70 H200 V20\" fill=\"none\" stroke=\"#f2604c\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/> <text x=\"110\" y=\"14\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4b6480\" font-family=\"Nunito\">6 cm</text> <text x=\"10\" y=\"78\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4b6480\" font-family=\"Nunito\">4</text> <text x=\"178\" y=\"45\" font-size=\"10\" text-anchor=\"middle\" fill=\"#f2604c\" font-family=\"Nunito\">2×2</text> </svg>","legenda":"Retângulo 6 × 4 cm com um canto de 2 × 2 cm retirado"},"alternativas":["24 cm²","20 cm²","28 cm²","16 cm²"],"correta":1,"dificuldade":3,"tipo_raciocinio":"multi-etapa","dica":"Calcule primeiro a área do retângulo inteiro. Depois tire a parte que foi recortada.","explicacao":"Retângulo inteiro: 6 × 4 = 24 cm². Quadradinho retirado: 2 × 2 = 4 cm². Sobrou 24 − 4 = 20 cm². Em figuras compostas, sempre pense em somar ou tirar retângulos.","passos":["Calcule a área do retângulo inteiro, como se nada tivesse sido cortado: 6 × 4.","Calcule a área do quadradinho que foi retirado: 2 × 2.","Tire o segundo do primeiro."]}]},{"missao_id":"prob","icone":"🎲","titulo":"Probabilidade","subtitulo":"Que chance eu tenho?","eixo":"Probabilidade e Estatística","tema_id":"MAT.PROB.SIMPLES","subtema":"Probabilidade simples","habilidade_bncc":"EF05MA22","ferramenta":"prob","regra":"Probabilidade = <b>quantos servem ÷ quantos existem no total</b>.<br> A mesma resposta pode aparecer como fração, decimal ou %. Impossível = 0 · certeza = 1.","aula":{"corpo":"<p>Probabilidade responde uma pergunta só: <mark>que chance uma coisa tem de acontecer?</mark> E existe uma única fórmula para tudo:</p>\n  <div class=\"lesson-box\" style=\"text-align:center;font-size:1.1rem\"><strong>quantos servem ÷ quantos existem no total</strong></div>\n  <p>Se numa sacola há 2 bolas verdes e 10 bolas no total, a chance de sair verde é <b>2/10</b>. Simplificando: 1/5. Em decimal: 0,2. Em porcentagem: 20%. <b>São as quatro formas de dizer a mesma coisa</b> — e a prova pode pedir qualquer uma delas.</p>\n  <p class=\"muted\">Duas armadilhas comuns: esquecer de somar <i>tudo</i> para achar o total, e ler \"maior que 4\" como se incluísse o 4 (não inclui!).</p>\n  <h3>Ferramenta 5 · Sacola de sorteio</h3>","fechamento":"<div class=\"lesson-box\"><strong>Duas fronteiras</strong> Se é <i>impossível</i>, a probabilidade é <b>0</b> (bola preta numa sacola sem bolas pretas). Se é <i>certeza</i>, é <b>1</b> ou 100%. Todo o resto fica entre esses dois.</div>"},"questoes":[{"questao_id":"MAT.PROB.SIMPLES.Q1","enunciado":"Numa sacola há 3 bolas vermelhas, 5 azuis e 2 verdes. Retirando uma sem olhar, qual é a probabilidade de sair <mark>azul</mark>?","figura":null,"alternativas":["1/5","5/8","1/2","2/5"],"correta":2,"dificuldade":1,"tipo_raciocinio":"conceitual","dica":"Primeiro o total: 3 + 5 + 2. Depois quantas são azuis.","explicacao":"Total = 3 + 5 + 2 = 10 bolas. Azuis = 5. Então 5/10, que simplificado é 1/2 (ou 50%)."},{"questao_id":"MAT.PROB.SIMPLES.Q2","enunciado":"Ao lançar um dado comum de 6 faces, qual é a probabilidade de sair um número <mark>menor que 3</mark>?","figura":null,"alternativas":["1/2","1/6","2/3","1/3"],"correta":3,"dificuldade":2,"tipo_raciocinio":"conceitual","dica":"Quais números do dado são menores que 3? Liste-os antes de fazer a conta.","explicacao":"Menores que 3 são apenas o 1 e o 2 — dois casos em 6. Logo 2/6 = 1/3. O próprio 3 não entra."},{"questao_id":"MAT.PROB.SIMPLES.Q3","enunciado":"Uma roleta tem 10 setores iguais e 4 deles são azuis. A chance de parar no azul, em <mark>porcentagem</mark>, é:","figura":null,"alternativas":["40%","4%","25%","14%"],"correta":0,"dificuldade":2,"tipo_raciocinio":"procedimental","dica":"4/10 em decimal é quanto? Depois multiplique por 100 para virar porcentagem.","explicacao":"4/10 = 0,4. Multiplicando por 100: 40%."}]},{"missao_id":"contas","icone":"🧮","titulo":"Contas com vírgula","subtitulo":"Somar, subtrair, multiplicar e resolver problemas","eixo":"Números","tema_id":"MAT.NUM.OPDEC","subtema":"Operações com decimais e problemas","habilidade_bncc":"EF05MA08","ferramenta":"contas","regra":"<b>Somar / subtrair:</b> vírgula embaixo de vírgula, complete com zeros.<br> <b>Multiplicar:</b> faça a conta sem vírgula e depois conte as casas dos dois números juntos.","aula":{"corpo":"<p>Aqui mora a pegadinha favorita das provas: <mark>somar e multiplicar seguem regras diferentes</mark>.</p>\n  <div class=\"lesson-box\"><strong>Somar e subtrair:</strong> alinhe a vírgula embaixo da vírgula e complete com zeros.<br><br>\n  <strong>Multiplicar:</strong> esqueça a vírgula, faça a conta normal, e no fim conte quantas casas decimais havia no total.</div>\n  <h3>Ferramenta 4 · Como armar cada conta</h3>","fechamento":"<div class=\"lesson-box\"><strong>Problema com duas etapas?</strong> Sublinhe o que a pergunta pede <i>no final</i>. Muita gente calcula certo o total e esquece de subtrair o troco.</div>"},"questoes":[{"questao_id":"MAT.NUM.OPDEC.Q1","enunciado":"Quanto vale <mark>0,25 × 0,4</mark>?","figura":null,"alternativas":["1,0","0,1","0,01","0,001"],"correta":1,"dificuldade":2,"tipo_raciocinio":"procedimental","dica":"25 × 4 = 100. Agora conte: 2 casas em 0,25 + 1 casa em 0,4 = 3 casas no resultado.","explicacao":"25 × 4 = 100. Com 3 casas decimais: 0,100 — que é o mesmo que 0,1. Zeros no fim do decimal não mudam o valor."},{"questao_id":"MAT.NUM.OPDEC.Q2","enunciado":"Quanto vale <mark>10 − 4,68</mark>?","figura":null,"alternativas":["6,32","5,42","5,32","6,42"],"correta":2,"dificuldade":1,"tipo_raciocinio":"procedimental","dica":"Escreva 10 como 10,00 antes de armar. Aí a vírgula fica embaixo da vírgula.","explicacao":"10,00 − 4,68 = 5,32. O segredo é transformar 10 em 10,00 para alinhar direito."},{"questao_id":"MAT.NUM.OPDEC.Q3","enunciado":"Alicia comprou 4 cadernos de R$ 8,75 e 3 canetas de R$ 3,50. Pagou com R$ 50,00. Qual foi o <mark>troco</mark>?","figura":null,"alternativas":["R$ 14,50","R$ 5,50","R$ 45,50","R$ 4,50"],"correta":3,"dificuldade":3,"tipo_raciocinio":"multi-etapa","dica":"São três etapas: cadernos (4 × 8,75), canetas (3 × 3,50), soma dos dois e só então o troco.","explicacao":"Cadernos: 4 × 8,75 = 35,00. Canetas: 3 × 3,50 = 10,50. Total: 45,50. Troco: 50,00 − 45,50 = R$ 4,50.","passos":["1ª parte: quanto custaram os 4 cadernos? (4 × 8,75)","2ª parte: quanto custaram as 3 canetas? (3 × 3,50)","3ª parte: some os dois valores para achar o total da compra.","4ª parte: o troco é 50,00 menos esse total."]}]},{"missao_id":"virgula","icone":"⚡","titulo":"A dança da vírgula","subtitulo":"Multiplicar e dividir por 10, 100 e 1000","eixo":"Números","tema_id":"MAT.NUM.MUL10","subtema":"Multiplicação por 10, 100 e 1000","habilidade_bncc":"EF05MA07","ferramenta":"virgula","regra":"<b>× 10 · 100 · 1000</b> → vírgula anda 1 · 2 · 3 casas para a <b>direita</b>.<br> Dividir faz o contrário: vírgula para a <b>esquerda</b>. Conte os zeros = conte as casas.","aula":{"corpo":"<p>Multiplicar por 10, 100 ou 1000 é a conta mais rápida da matemática — porque <mark>você nem precisa fazer conta</mark>. A vírgula é que se mexe.</p>\n  <div class=\"lesson-box\"><strong>× 10</strong> → 1 casa para a direita<br><strong>× 100</strong> → 2 casas para a direita<br><strong>× 1000</strong> → 3 casas para a direita<br><br>\n  Dividindo, a vírgula anda o mesmo tanto, só que para a <strong>esquerda</strong>. Conte os zeros e você conta as casas.</div>\n  <h3>Ferramenta 3 · Máquina da vírgula</h3>","fechamento":"<div class=\"lesson-box\"><strong>Faltou casa?</strong> Coloque zeros. 8,4 × 1000 vira 8400 — foram necessários dois zeros novos para a vírgula ter por onde andar.</div>"},"questoes":[{"questao_id":"MAT.NUM.MUL10.Q1","enunciado":"Quanto vale <mark>0,0084 × 1000</mark>?","figura":null,"alternativas":["8,4","84","0,84","840"],"correta":0,"dificuldade":1,"tipo_raciocinio":"procedimental","dica":"Três zeros = três casas para a direita: 0,0084 → 0,084 → 0,84 → ?","explicacao":"Andando 3 casas para a direita: 0,0084 → 0,084 → 0,84 → 8,4."},{"questao_id":"MAT.NUM.MUL10.Q2","enunciado":"Qual número, <mark>multiplicado por 100</mark>, resulta em 4,7?","figura":null,"alternativas":["0,47","0,047","470","47"],"correta":1,"dificuldade":2,"tipo_raciocinio":"conceitual","dica":"Aqui o caminho é ao contrário: em vez de avançar, a vírgula precisa voltar 2 casas.","explicacao":"Voltando 2 casas em 4,7: 0,47 → 0,047. Confere: 0,047 × 100 = 4,7."},{"questao_id":"MAT.NUM.MUL10.Q3","enunciado":"Um número foi multiplicado por 10 e <b>depois</b> por 100. O resultado deu 350. Qual era o número?","figura":null,"alternativas":["3,5","35","0,35","0,035"],"correta":2,"dificuldade":3,"tipo_raciocinio":"multi-etapa","dica":"× 10 e depois × 100 é o mesmo que × 1000. Agora desfaça: volte 3 casas.","explicacao":"Multiplicar por 10 e depois por 100 é multiplicar por 1000. Desfazendo, a vírgula volta 3 casas: 350 → 35,0 → 3,50 → 0,350 = 0,35.","passos":["× 10 e depois × 100 é o mesmo que multiplicar por quanto?","Se o resultado foi 350, para achar o número original a vírgula tem que <b>voltar</b> quantas casas?","Ande as 3 casas para a esquerda em 350."]}]},{"missao_id":"fracao","icone":"🍕","titulo":"Fração vira decimal (e volta)","subtitulo":"Duas formas de escrever a mesma coisa","eixo":"Números","tema_id":"MAT.NUM.FRA","subtema":"Conversão fração ↔ decimal","habilidade_bncc":"EF05MA03","ferramenta":"fracao","regra":"<b>Fração → decimal:</b> divida o de cima pelo de baixo.<br> <b>Decimal → fração:</b> 1 casa = /10 · 2 casas = /100 · 3 casas = /1000, depois simplifique.","aula":{"corpo":"<p>Fração e decimal são <mark>dois idiomas para o mesmo número</mark>. E existe um tradutor simples:</p>\n  <div class=\"lesson-box\"><strong>Fração → decimal:</strong> é só dividir o de cima pelo de baixo. 3/8 = 3 ÷ 8 = 0,375<br><br>\n  <strong>Decimal → fração:</strong> escreva sobre 10, 100 ou 1000 (uma casa = 10, duas = 100, três = 1000) e depois simplifique. 0,24 = 24/100 = 6/25</div>\n  <h3>Ferramenta 2 · Barra mágica</h3>","fechamento":"<div class=\"lesson-box\"><strong>Atenção nas irredutíveis</strong> 24/100, 12/50 e 6/25 valem o mesmo. Mas só 6/25 é <i>irredutível</i>: é a que não dá mais para simplificar.</div>"},"questoes":[{"questao_id":"MAT.NUM.FRA.Q1","enunciado":"Transformando <mark>7/8</mark> em número decimal, obtemos:","figura":null,"alternativas":["0,78","0,87","1,142","0,875"],"correta":3,"dificuldade":2,"tipo_raciocinio":"procedimental","dica":"7 ÷ 8. Se 1/8 = 0,125, quanto são sete deles?","explicacao":"7 ÷ 8 = 0,875. Confere: 0,875 × 8 = 7. Outro caminho: 1/8 = 0,125, e 0,125 × 7 = 0,875."},{"questao_id":"MAT.NUM.FRA.Q2","enunciado":"O número <mark>0,36</mark> escrito como fração <b>irredutível</b> é:","figura":null,"alternativas":["9/25","36/100","18/50","3/6"],"correta":0,"dificuldade":2,"tipo_raciocinio":"procedimental","dica":"Duas casas decimais = sobre 100. Depois divida em cima e embaixo pelo mesmo número, até não dar mais.","explicacao":"0,36 = 36/100. Dividindo os dois por 4: 9/25. As opções 36/100 e 18/50 valem o mesmo, mas ainda dá para simplificar."},{"questao_id":"MAT.NUM.FRA.Q3","enunciado":"Quem é <mark>maior</mark>: 3/5 ou 0,62?","figura":null,"alternativas":["3/5","0,62","São iguais","Não dá para comparar"],"correta":1,"dificuldade":3,"tipo_raciocinio":"conceitual","dica":"Coloque os dois no mesmo idioma: quanto dá 3 ÷ 5?","explicacao":"3/5 = 3 ÷ 5 = 0,6. Comparando 0,60 com 0,62, o maior é 0,62. Para comparar fração com decimal, traduza sempre um para o formato do outro.","passos":["Traduza a fração: 3 ÷ 5 = ?","Escreva os dois com 2 casas para comparar: 0,60 e 0,62.","Qual dos dois é o maior?"]}]},{"missao_id":"valor","icone":"🔢","titulo":"Decimais sob controle","subtitulo":"Valor posicional, leitura e comparação","eixo":"Números","tema_id":"MAT.NUM.DEC","subtema":"Valor posicional, leitura e comparação","habilidade_bncc":"EF05MA02","ferramenta":"valor","regra":"1ª casa = <b>décimos</b> · 2ª = <b>centésimos</b> · 3ª = <b>milésimos</b><br> Para comparar, <b>complete todos com zeros</b> até ficarem do mesmo tamanho.","aula":{"corpo":"<p>Um número decimal é um número inteiro com <mark>pedacinhos a mais</mark>. Cada casa depois da vírgula tem um nome e um tamanho:</p>\n  <div class=\"lesson-box\"><strong>1ª casa = décimos</strong> (0,1 · um pedaço de 10)<br>\n  <strong>2ª casa = centésimos</strong> (0,01 · um pedaço de 100)<br>\n  <strong>3ª casa = milésimos</strong> (0,001 · um pedaço de 1000)</div>\n  <p>Por isso <b>0,7 é maior que 0,68</b>, mesmo tendo menos algarismos: 0,7 são <i>sete</i> décimos e 0,68 são só <i>seis</i> décimos e um pouquinho.</p>\n  <h3>Ferramenta 1 · Raio-X do número</h3>","fechamento":"<div class=\"lesson-box\"><strong>Guarde este truque</strong> Para comparar decimais, complete todos com zeros até ficarem do mesmo tamanho. Depois é só comparar como números inteiros.</div>"},"questoes":[{"questao_id":"MAT.NUM.DEC.Q1","enunciado":"No número <mark>3,472</mark>, quanto vale o algarismo <b>7</b>?","figura":null,"alternativas":["7 décimos (0,7)","7 milésimos (0,007)","7 centésimos (0,07)","7 unidades"],"correta":2,"dificuldade":1,"tipo_raciocinio":"conceitual","dica":"Conte as casas depois da vírgula: 4 é a 1ª, 7 é a 2ª. E a 2ª casa é a dos…","explicacao":"O 7 está na 2ª casa depois da vírgula, a dos centésimos. Então ele vale 0,07."},{"questao_id":"MAT.NUM.DEC.Q2","enunciado":"Coloque em <mark>ordem decrescente</mark> (do maior para o menor):","figura":null,"alternativas":["2,5 · 2,105 · 2,15 · 2,051","2,15 · 2,5 · 2,105 · 2,051","2,051 · 2,105 · 2,15 · 2,5","2,5 · 2,15 · 2,105 · 2,051"],"correta":3,"dificuldade":2,"tipo_raciocinio":"procedimental","dica":"Complete todos com 3 casas: 2,500 · 2,150 · 2,105 · 2,051. Agora compare.","explicacao":"Igualando as casas: 2,500 > 2,150 > 2,105 > 2,051. Cuidado: 2,105 parece grande por ter mais algarismos, mas tem só 1 décimo."},{"questao_id":"MAT.NUM.DEC.Q3","enunciado":"Qual número está <mark>exatamente no meio</mark> entre 4,2 e 4,3?","figura":null,"alternativas":["4,25","4,23","4,15","4,5"],"correta":0,"dificuldade":3,"tipo_raciocinio":"conceitual","dica":"Pense em 4,20 e 4,30. Qual número fica bem no meio de 20 e 30?","explicacao":"4,2 = 4,20 e 4,3 = 4,30. O meio entre 20 e 30 é 25, então a resposta é 4,25.","passos":["Escreva os dois números com o mesmo número de casas: 4,2 = 4,<b>20</b> e 4,3 = 4,<b>30</b>.","Agora esqueça a vírgula: qual número fica bem no meio entre 20 e 30?","Volte a vírgula para o lugar: 4,<b>25</b>."]}]}]}
</script>
</head>
<body>
<div class="wrap">

  <div class="hud" id="hud">
    <span class="lvl" id="lvlLabel">Nível 1 · Aprendiz</span>
    <span class="xpbar"><span class="xpfill" id="xpFill"></span></span>
    <span class="xpnum" id="xpNum">0 XP</span>
    <span class="medals" id="medals"></span>
    <span class="shield hidden" id="shieldIcon">🛡️</span>
    <span class="streak hidden" id="streak"></span>
    <button class="toggle" id="focusBtn" title="Reduz cores, animações e confete">🎯 Modo foco</button>
  </div>

  <!-- MAPA -->
  <section id="map" class="card">
    <p class="eyebrow" id="mapEyebrow"></p>
    <h1 id="mapTitle"></h1>
    <p class="muted" id="mapIntro"></p>
    <div class="mods" id="modList"></div>
    <p class="quemlinha" id="quemLinha"></p>
    <div class="rowend"><span class="muted" id="resumeNote"></span><button class="btn ghost small hidden" id="resetBtn">Recomeçar tudo</button></div>
  </section>

  <!-- QUEM ESTÁ ESTUDANDO -->
  <section id="quemEstuda" class="card hidden">
    <p class="eyebrow" id="quemEyebrow"></p>
    <h1>Quem está estudando?</h1>
    <p class="muted">Fica guardado neste aparelho — você só escolhe uma vez.</p>
    <div class="mods" id="listaAlunas"></div>
  </section>

  <!-- AULA -->
  <section id="lesson" class="card hidden">
    <div class="navtop"><button class="btn ghost small" id="lessonExit">← Voltar ao mapa</button></div>
    <p class="eyebrow" id="lessonEyebrow">Missão</p>
    <h2 id="lessonTitle"></h2>
    <div class="stepdots" id="stepDots"></div>
    <div id="lessonBody"></div>
    <div class="lesson-nav">
      <button class="btn ghost small hidden" id="lessonBack">← Voltar</button>
      <span></span>
      <button class="btn mint" id="lessonNext">Continuar</button>
      <button class="btn mint hidden" id="toQuizBtn">Entendi! Bora para os desafios</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="card hidden">
    <div class="navtop"><button class="btn ghost small" id="quizExit">← Voltar ao mapa</button></div>
    <div class="qhead">
      <span class="tag" id="qTag"></span>
      <span class="dots" id="dots"></span>
    </div>
    <details class="rulecard" id="ruleCard" open>
      <summary>📌 A regra desta missão</summary>
      <div class="rtext" id="ruleText"></div>
    </details>
    <div class="question" id="qText"></div>
    <div id="qFigure"></div>
    <div class="opts" id="opts"></div>
    <div class="center" style="margin-top:12px">
      <button class="btn ghost small hidden" id="stepBtn">🧩 Quebrar em partes</button>
    </div>
    <div class="stepbox" id="stepBox"></div>
    <div class="hintbox" id="hintBox"></div>
    <div class="feedback" id="feedback"></div>
    <div class="rowend">
      <button class="btn ghost small" id="hintBtn">💡 Preciso de uma dica</button>
      <span style="display:flex;gap:8px">
        <button class="btn mint hidden" id="confirmBtn">Confirmar resposta</button>
        <button class="btn hidden" id="nextBtn">Próxima</button>
      </span>
    </div>
  </section>

  <!-- FIM DE MISSÃO -->
  <section id="moduleDone" class="card center hidden">
    <div class="big pop" id="medalIcon">🥇</div>
    <h2 id="doneTitle"></h2>
    <p class="muted" id="doneMsg"></p>
    <p class="xpop" id="doneXp"></p>
    <div id="pauseArea"></div>
    <button class="btn" id="backToMap">Voltar ao mapa</button>
  </section>

  <!-- FINAL -->
  <section id="final" class="card hidden">
    <p class="eyebrow">Jornada completa</p>
    <h1 id="finalTitle"></h1>
    <div class="big" id="finalXp"></div>
    <p class="muted" id="finalMsg"></p>
    <div id="finalReview"></div>
    <div class="rowend"><button class="btn" id="restartBtn">Jogar de novo</button></div>
  </section>

</div>

<script>
/* ============================ FERRAMENTAS INTERATIVAS ============================ */
const tools = {};

/* 1 · Quadro de valor posicional + comparação */
tools.valor = () => `
<div class="tool">
  <p class="center" style="font-weight:700;margin-bottom:10px">Clique em cada algarismo de <span style="font-family:Fredoka">3,472</span></p>
  <div class="ctrls" id="pvDigits"></div>
  <div class="readout" id="pvOut"><small>toque em um algarismo acima</small>—</div>
  <hr style="border:none;border-top:1.5px dashed var(--line);margin:16px 0">
  <p class="center" style="font-weight:700;margin-bottom:6px">Truque para comparar: deixe todos com o mesmo tamanho</p>
  <div class="readout" id="cmpOut" style="font-size:1.15rem"></div>
  <div class="center"><button class="chip" id="cmpBtn">Completar com zeros</button></div>

/* ============================ CONTEÚDO DA PROVA ============================
   Nada de conteúdo mora aqui. Missões, regras, andaimes e figuras vêm do
   <script id="prova-data">, que build.mjs injeta a partir de data/provas/.
   Abrir src/motor.html direto no navegador falha de propósito: o motor sozinho
   não é um app, é metade dele. */
const PROVA = (() => {
  const tag = document.getElementById('prova-data');
  if (!tag) throw new Error('prova-data ausente — gere o arquivo com "node build.mjs <prova_id>".');
  const p = JSON.parse(tag.textContent);
  if (!p.missoes?.length) throw new Error('prova-data sem missões.');
  return p;
})();
/* A ordem de aplicação é decidida na criação da prova (missões mais frágeis
   primeiro, enquanto a atenção está melhor). O motor não reordena. */
const missoes    = PROVA.missoes;
const N_MISSOES  = missoes.length;
const N_QUESTOES = missoes.reduce((a, m) => a + m.questoes.length, 0);

/* ============================ FIGURAS ============================
   O JSON é dono do conteúdo, o motor é dono da moldura. */
function barrasSVG(d, interativo){
  const serie = d.serie, n = serie.length;
  const topo = Math.max(3, Math.ceil(Math.max(...serie.map(p => p[1])) / 3) * 3);
  const base = 150, x0 = 32;
  const passo = (330 - x0 - 10) / n, bw = Math.min(36, passo * .66), esc = (base - 14) / topo;
  const tick = Math.max(1, Math.round(topo / 4));
  const cores = ['#2fae94','#7a6cf0','#f2604c','#ffc857'];
  let eixoY = '';
  for (let v = 0; v <= topo; v += tick)
    eixoY += `<g><line x1="28" y1="${base-v*esc}" x2="32" y2="${base-v*esc}" stroke="#17324a"/>`+
      `<text x="24" y="${base+4-v*esc}" font-size="10" text-anchor="end" fill="#4b6480" font-family="Nunito">${v}</text></g>`;
  const barras = serie.map(([rot, v], i) => {
    const x = x0 + 8 + i*passo + (passo-bw)/2, h = v*esc;
    return `<g ${interativo ? `class="gbar" data-i="${i}" style="cursor:pointer"` : ''}>
      <rect x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="3" fill="${cores[i%4]}"/>
      <text x="${x+bw/2}" y="${base-h-5}" font-size="11" font-weight="700" text-anchor="middle" fill="#17324a" font-family="Nunito">${v}</text>
      <text x="${x+bw/2}" y="${base+16}" font-size="11" text-anchor="middle" fill="#4b6480" font-family="Nunito">${rot}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 330 180" width="100%" role="img" aria-label="${d.titulo||'gráfico de barras'}">
    <line x1="${x0}" y1="${base}" x2="322" y2="${base}" stroke="#17324a" stroke-width="1.5"/>
    <line x1="${x0}" y1="10" x2="${x0}" y2="${base}" stroke="#17324a" stroke-width="1.5"/>
    ${eixoY}${barras}</svg>`;
}
function figuraHTML(fig, missao){
  if (!fig) return '';
  if (fig.tipo === 'svg')
    return `<figure class="chart">${fig.conteudo}${fig.legenda ? `<figcaption>${fig.legenda}</figcaption>` : ''}</figure>`;
  if (fig.tipo === 'barras') {
    const d = fig.fonte === 'missao' ? missao?.dados : fig;
    if (!d?.serie?.length) { console.warn('figura barras sem série', missao?.missao_id); return ''; }
    return `<figure class="chart">${barrasSVG(d, false)}<figcaption>${d.titulo||''}</figcaption></figure>`;
  }
  console.warn('tipo de figura desconhecido:', fig.tipo);
  return '';
}

/* Guarda: uma prova nova pode pedir uma ferramenta que este motor não tem.
   Isso já é barrado no build; aqui é a rede embaixo, para a aula não morrer. */

    return '<div class="tool"><p class="center muted">A parte de mexer desta missão não abriu. Pode seguir para os desafios — a explicação acima já dá conta.</p></div>';
  }

}
function ferramentaInit(m){
  const t = m.ferramenta && tools[m.ferramenta];
  if (typeof t === 'function' && typeof t.init === 'function') {
    try { t.init(); } catch (e) { console.warn('falha ao iniciar a ferramenta', m.ferramenta, e); }

/* ==================================================================
   TELEMETRIA — UMA LINHA POR QUESTÃO RESPONDIDA
   Resumo não se desagrega; detalhe se agrega com fórmula. Por isso não
   existe linha "por missão" nem "por prova": elas se calculam na planilha.

   A URL do Apps Script é injetada por build.mjs a partir de SHEET_URL do
   ambiente. Sem ela, nada é perdido: as linhas vão para a fila local e
   saem pelo botão "Copiar resultados".
   ================================================================== */
const SHEET_URL = "";
const TEM_URL   = !!SHEET_URL && !SHEET_URL.startsWith('__');
/* ---------- quem está estudando ----------
   A coluna `aluna` decide de quem é o dado. Errar isso não é detalhe estético:
   um adulto testando responde rápido demais e acerta demais, e essas duas
   coisas são exatamente as métricas da tabela de calibragem. Um teste gravado
   como se fosse ela envenena a decisão da próxima prova.

   A escolha é por APARELHO, não por prova: o tablet dela é dela em toda prova
   futura. Por isso a chave não leva o prova_id. */
const ALUNAS    = (Array.isArray(PROVA.alunas) && PROVA.alunas.length) ? PROVA.alunas : ['Aluna'];
const KEY_ALUNA = 'missao_aluna_v1';
let alunaMem    = '';
function lerAluna(){ try{ return localStorage.getItem(KEY_ALUNA)||alunaMem; }catch(e){ return alunaMem; } }
function gravarAluna(n){ alunaMem=n; try{ localStorage.setItem(KEY_ALUNA,n); }catch(e){} }
/* Nome guardado que não está nesta prova (prova de outra filha, nome renomeado)
   volta a perguntar, em vez de gravar linha no nome errado. */
function alunaEscolhida(){ const a=lerAluna(); return !!a && ALUNAS.includes(a); }
function alunaAtual(){ return alunaEscolhida() ? lerAluna() : ALUNAS[0]; }
/* Fila por prova: duas provas na mesma origem não disputam a chave. */
const FILA      = `missao_fila_${PROVA.prova_id}_v2`;
let linhas = [];                // o que foi gerado nesta aba

/* Campos da seção 5 do CLAUDE.md, nesta ordem. É a mesma ordem do
   cabeçalho de apps-script/enviar.gs — mudar aqui exige mudar lá. */
const COLUNAS = ['evento_id','sessao_id','timestamp','aluna','materia','eixo','tema_id',
  'subtema','questao_id','habilidade_bncc','escola','ano_aluna','nivel_conteudo','bimestre',
  'contexto','resultado','usou_dica','usou_andaime','dificuldade','tipo_raciocinio',
  'seg_ate_1o_toque','seg_total','saiu_da_tela','tempo_valido','retomada',
  'posicao_na_sessao','modo_foco','dispositivo'];

function lerFila(){try{return JSON.parse(localStorage.getItem(FILA)||'[]');}catch(e){return [];}}
function salvarFila(f){try{localStorage.setItem(FILA,JSON.stringify(f));}catch(e){}}

async function enviarLinha(row){
  linhas.push(row);
  if(!TEM_URL){salvarFila([...lerFila(),row]);return;}
  try{
    await fetch(SHEET_URL,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(row)});
  }catch(e){salvarFila([...lerFila(),row]);}   // sem internet? guarda e tenta na proxima abertura
}
async function esvaziarFila(){
  if(!TEM_URL)return;
  const f=lerFila(); if(!f.length)return; salvarFila([]);
  for(const r of f){await enviarLinha(r);}
}
function copiarResultados(){
  /* Sem SHEET_URL cada linha vai para os dois lugares: a fila do localStorage
     e a lista desta aba. Sem deduplicar, tudo que foi respondido depois da
     última recarga sairia em dobro. A chave é o evento_id. */
  const vistos=new Set(), base=[];
  for(const r of [...lerFila(),...linhas]){
    const k=r.evento_id||JSON.stringify(r);
    if(vistos.has(k))continue;
    vistos.add(k); base.push(r);
  }
  if(!base.length)return alert('Nada para copiar ainda.');
  const tsv=[COLUNAS.join('\t'),...base.map(r=>COLUNAS.map(c=>{
    const v=r[c]; return Array.isArray(v)?v.join(' | '):(typeof v==='boolean'?(v?'sim':'nao'):(v??''));
  }).join('\t'))].join('\n');
  navigator.clipboard.writeText(tsv).then(()=>alert('Resultados copiados! Cole direto numa planilha.'),
    ()=>prompt('Copie o texto abaixo:',tsv));
}

/* ---------- relógio da questão ----------
   Medido sempre, exibido nunca. Pressão de tempo derruba o desempenho em
   vez de revelá-lo — nenhum destes números vai para a tela da aluna.
   O que interessa é o tempo até o PRIMEIRO toque (leitura + decisão);
   depois disso é ruído de digitação e hesitação motora. */
const LIMITE_SEG = 180;         // acima disso o cronômetro virou almoço
let relogio = null;
function iniciarRelogio(){ relogio = {t0:Date.now(), primeiro:null, saiu:false}; }
function marcarPrimeiroToque(){ if(relogio && relogio.primeiro===null) relogio.primeiro=Date.now(); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden && relogio) relogio.saiu=true; });

function dispositivo(){
  const l=Math.min(screen.width,screen.height);
  const toque=matchMedia('(pointer:coarse)').matches;
  if(!toque) return 'computador';
  return l<600 ? 'celular' : 'tablet';
}
function novoId(){ return Math.random().toString(36).slice(2,10); }

/* Uma sessão = uma passagem pela prova, mesmo que ela feche a aba no meio.
   Fechar e voltar não vira sessão nova: vira `retomada = true` nas linhas
   seguintes, que é a informação que realmente muda a leitura do dado. */
function sessaoId(){
  if(!S.sessao) { S.sessao = new Date().toISOString().slice(0,10)+'-'+novoId(); }
  return S.sessao;
}

function registrarQuestao(m,q,resultado){
  const fim=Date.now();
  const r=relogio||{t0:fim,primeiro:null,saiu:false};
  const segTotal=+((fim-r.t0)/1000).toFixed(1);
  const segToque=r.primeiro!==null ? +((r.primeiro-r.t0)/1000).toFixed(1) : '';
  S.posicao=(S.posicao||0)+1;
  enviarLinha({
    evento_id:`${sessaoId()}-${String(S.posicao).padStart(3,'0')}`,
    sessao_id:sessaoId(),
    timestamp:new Date(fim).toISOString(),
    aluna:alunaAtual(),
    materia:PROVA.materia, eixo:m.eixo, tema_id:m.tema_id, subtema:m.subtema,
    questao_id:q.questao_id, habilidade_bncc:m.habilidade_bncc,
    escola:PROVA.escola, ano_aluna:PROVA.ano_aluna, nivel_conteudo:PROVA.nivel_conteudo,
    bimestre:PROVA.bimestre, contexto:PROVA.contexto,
    resultado,
    usou_dica:!!S.usedHint,
    usou_andaime:stepsShown>0,
    dificuldade:q.dificuldade, tipo_raciocinio:q.tipo_raciocinio,
    seg_ate_1o_toque:segToque, seg_total:segTotal,
    saiu_da_tela:r.saiu,
    tempo_valido:!r.saiu && segTotal<=LIMITE_SEG,
    retomada:!!S.retomou,
    posicao_na_sessao:S.posicao,
    modo_foco:!!S.focus,
    dispositivo:dispositivo()
  });
}

/* ============================ ESTADO E ARMAZENAMENTO ============================ */
/* Progresso é por prova, não por aluna: senão a revisão de português herdaria
   as medalhas da de matemática. */
const KEY=`missao_progresso_${PROVA.prova_id}_v2`;
let mem=null;
const store={
  async save(s){const raw=JSON.stringify(s);
    try{if(window.storage?.set){await window.storage.set(KEY,raw);return;}}catch(e){}
    try{localStorage.setItem(KEY,raw);return;}catch(e){} mem=raw;},
  async load(){
    try{if(window.storage?.get){const r=await window.storage.get(KEY);if(r?.value)return JSON.parse(r.value);}}catch(e){}
    try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}
    try{return mem?JSON.parse(mem):null;}catch(e){return null;}},
  async clear(){try{if(window.storage?.delete)await window.storage.delete(KEY);}catch(e){}
    try{localStorage.removeItem(KEY);}catch(e){} mem=null;}
};

let S={xp:0,streak:0,best:0,done:{},screen:'map',mod:0,q:0,usedHint:false,errors:[],unlocked:1,focus:false,shield:true};
const el=id=>document.getElementById(id);

/* Rótulos de tela vêm dos metadados da prova — nenhum número de missão
   ou de questão escrito à mão. */
const NUM=['nenhuma','uma','duas','três','quatro','cinco','seis','sete','oito','nove','dez'];
function rotulos(){
  const porMissao=[...new Set(missoes.map(m=>m.questoes.length))];
  const desafios=porMissao.length===1?`${porMissao[0]} desafios`:'alguns desafios';
  el('mapEyebrow').textContent=`${PROVA.ano_aluna} · ${PROVA.materia}`;
  el('mapTitle').textContent=PROVA.titulo;
  el('mapIntro').innerHTML=`${(NUM[N_MISSOES]||N_MISSOES).replace(/^./,c=>c.toUpperCase())} missões. `+
    `Em cada uma, primeiro você <strong>aprende com uma ferramenta que dá para mexer</strong>, e só depois responde ${desafios}. `+
    `Complete uma para abrir a próxima e conquistar as medalhas.`;
  el('finalTitle').textContent=`Você fechou as ${N_MISSOES} missões! 🎉`;
  document.title=PROVA.titulo;
}
const LEVELS=[[0,'Aprendiz'],[300,'Exploradora'],[700,'Investigadora'],[1200,'Estrategista'],[1800,'Mestra dos Números']];

function save(){store.save(S);}
function levelOf(xp){let l=0;LEVELS.forEach((L,i)=>{if(xp>=L[0])l=i;});return l;}

function hud(){
  const l=levelOf(S.xp), next=LEVELS[l+1]?LEVELS[l+1][0]:LEVELS[l][0]+400, base=LEVELS[l][0];
  el('lvlLabel').textContent=`Nível ${l+1} · ${LEVELS[l][1]}`;
  el('xpFill').style.width=Math.min(100,((S.xp-base)/(next-base))*100)+'%';
  el('xpNum').textContent=`${S.xp} XP`;
  el('medals').innerHTML=missoes.map(m=>`<span class="${S.done[m.missao_id]?'on':''}">${S.done[m.missao_id]||'🏅'}</span>`).join('');
  el('shieldIcon').classList.toggle('hidden',!S.shield);
  const st=el('streak');
  if(S.streak>=2){st.classList.remove('hidden');st.textContent=`🔥 ${S.streak} seguidas`;}else st.classList.add('hidden');
}

/* modo foco: menos cor, zero confete, sem animações */
el('focusBtn').onclick=()=>{S.focus=!S.focus;applyFocus();save();};
function applyFocus(){
  document.body.classList.toggle('focus',!!S.focus);
  el('focusBtn').classList.toggle('on',!!S.focus);
  el('focusBtn').textContent=S.focus?'🎯 Foco ligado':'🎯 Modo foco';
}

function show(id){['map','quemEstuda','lesson','quiz','moduleDone','final'].forEach(s=>el(s).classList.add('hidden'));el(id).classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});}

/* Tela de escolha: só aparece quando ninguém foi escolhido neste aparelho,
   ou quando o nome guardado não serve para esta prova. Depois disso ela some
   para sempre e vira uma linha de rodapé no mapa. */
function pedirAluna(depois){
  el('quemEyebrow').textContent=`${PROVA.ano_aluna} · ${PROVA.materia}`;
  el('listaAlunas').innerHTML=ALUNAS.map((n,i)=>
    `<button class="mod" data-n="${i}"><span class="ic">${/teste/i.test(n)?'🧪':'👋'}</span>
      <span><span class="tt">${n}</span></span></button>`).join('');
  document.querySelectorAll('#listaAlunas .mod').forEach(b=>
    b.onclick=()=>{gravarAluna(ALUNAS[+b.dataset.n]);depois();});
  show('quemEstuda');
}

/* uma missão abre quando a anterior da lista atual estiver concluída */
function isOpen(i){return i===0 || !!S.done[missoes[i-1]?.missao_id];}

/* ====== SAIR DE UMA MISSÃO PELA METADE ======
   Uma missão só conta quando termina. Sair — pelo botão ou fechando a aba —
   descarta a posição dentro dela: da próxima vez recomeça pela aula.

   O que NÃO se desfaz, de propósito:
   · o XP já ganho nas questões respondidas. Ela encarou, ela ganhou. Tirar de
     volta é enquadramento de perda, o mesmo motivo pelo qual errar vale 20 e
     não zero.
   · as linhas de telemetria já emitidas. São fatos do que aconteceu; apagá-las
     falsificaria o log. Se ela refizer a missão, as novas respostas geram
     linhas novas, com posicao_na_sessao maior — duas tentativas de verdade. */
function descartarParcial(){
  S.modId=null; S.q=0; S.correctInMod=0; S.usedHint=false; S.screen='map';
  chosen=null; attempts=0; stepsShown=0; relogio=null;
}
function sairDaMissao(pedirConfirmacao){
  if(pedirConfirmacao && !confirm('Você vai recomeçar esta missão do início na próxima vez. O XP que já ganhou continua seu. Voltar ao mapa?')) return;
  descartarParcial(); save(); drawMap();
}
el('lessonExit').onclick=()=>sairDaMissao(false);   // na aula não há o que perder
el('quizExit').onclick=()=>sairDaMissao(true);      // nos desafios, o mesmo freio dos dois toques

function drawMap(){
  el('modList').innerHTML=missoes.map((m,i)=>{
    const done=S.done[m.missao_id], open=isOpen(i);
    return `<button class="mod ${done?'done':''}" data-i="${i}" ${open?'':'disabled'}>
      <span class="ic">${open?m.icone:'🔒'}</span>
      <span><span class="tt">${i+1}. ${m.titulo}</span><br><span class="st">${open?m.subtitulo:'Complete a missão anterior para abrir'}</span></span>
      <span class="badge">${done||''}</span></button>`;}).join('');
  // escopado ao mapa: a tela de escolha de aluna também usa .mod
  document.querySelectorAll('#modList .mod').forEach(b=>b.onclick=()=>openModule(+b.dataset.i));
  const allDone=missoes.every(m=>S.done[m.missao_id]);
  el('resetBtn').classList.toggle('hidden',S.xp===0);
  el('resumeNote').textContent = allDone ? 'Todas as missões concluídas! Você pode refazer qualquer uma.' :
    (S.xp>0?'Seu progresso fica salvo automaticamente.':'');
  el('quemLinha').innerHTML=`Estudando como <b>${alunaAtual()}</b>`+
    `<button class="btn ghost small" id="trocarAluna">trocar</button>`;
  el('trocarAluna').onclick=()=>pedirAluna(()=>drawMap());
  show('map');
}

/* Quebra o texto da aula em passos: um bloco por tela, o penúltimo com a ferramenta. */
function buildSteps(m){
  const pre=m.aula.corpo.split('<h3>')[0], head=m.aula.corpo.includes('<h3>')?'<h3>'+m.aula.corpo.split('<h3>')[1]:'';
  const blocks=pre.match(/<p[\s\S]*?<\/p>|<div class="lesson-box">[\s\S]*?<\/div>/g)||[pre];
  const steps=[];
  for(let i=0;i<blocks.length;i++){
    if(blocks[i].startsWith('<p')&&blocks[i+1]&&blocks[i+1].startsWith('<div')){steps.push(blocks[i]+blocks[i+1]);i++;}
    else steps.push(blocks[i]);
  }
  steps.push(head+ferramentaHTML(m));
  if(m.aula.fechamento)steps.push(m.aula.fechamento);
  return steps;
}
let lessonSteps=[],lessonStep=0;

function openModule(i){
  S.mod=i;S.modId=missoes[i].missao_id;S.q=0;S.screen='lesson';S.usedHint=false;S.shield=true;save();
  const m=missoes[i];
  el('lessonEyebrow').textContent=`Missão ${i+1} de ${N_MISSOES}`;
  el('lessonTitle').textContent=m.titulo;
  lessonSteps=buildSteps(m);lessonStep=0;
  drawLessonStep();
  show('lesson');
}

function drawLessonStep(){
  const m=missoes[S.mod];
  el('lessonBody').innerHTML=lessonSteps[lessonStep];
  el('stepDots').innerHTML=lessonSteps.map((_,i)=>`<i class="${i<=lessonStep?'on':''}"></i>`).join('');
  if(lessonSteps[lessonStep].includes('class="tool"'))ferramentaInit(m);
  const last=lessonStep===lessonSteps.length-1;
  el('lessonBack').classList.toggle('hidden',lessonStep===0);
  el('lessonNext').classList.toggle('hidden',last);
  el('toQuizBtn').classList.toggle('hidden',!last);
}
el('lessonNext').onclick=()=>{if(lessonStep<lessonSteps.length-1){lessonStep++;drawLessonStep();window.scrollTo({top:0,behavior:'smooth'});}};
el('lessonBack').onclick=()=>{if(lessonStep>0){lessonStep--;drawLessonStep();window.scrollTo({top:0,behavior:'smooth'});}};
el('toQuizBtn').onclick=()=>{S.screen='quiz';S.q=0;S.correctInMod=0;save();renderQ();};

let chosen=null, stepsShown=0, attempts=0;

function renderQ(){
  const m=missoes[S.mod],q=m.questoes[S.q];
  S.usedHint=false;chosen=null;stepsShown=0;attempts=0;
  el('qTag').textContent=m.titulo;
  el('ruleText').innerHTML=m.regra||'';
  el('dots').innerHTML=m.questoes.map((_,i)=>`<i class="${i<S.q?'on':i===S.q?'now':''}"></i>`).join('');
  el('qText').innerHTML=`<span class="muted" style="font-size:.9rem;font-weight:600">Desafio ${S.q+1} de ${m.questoes.length}</span><br>${q.enunciado}`;
  el('qFigure').innerHTML=figuraHTML(q.figura,m);
  const box=el('opts');box.innerHTML='';
  q.alternativas.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';
    b.innerHTML=`<span class="letter">${'ABCD'[i]}</span><span>${t}</span>`;b.onclick=()=>select(i);box.appendChild(b);});
  el('feedback').className='feedback';el('feedback').innerHTML='';
  el('hintBox').className='hintbox';el('hintBox').innerHTML='';
  el('hintBtn').classList.remove('hidden');
  el('nextBtn').classList.add('hidden');
  el('confirmBtn').classList.add('hidden');
  el('nextBtn').textContent=S.q===m.questoes.length-1?'Finalizar missão':'Próximo desafio';
  // andaime, só nas questões que declararam passos
  el('stepBox').className='stepbox';el('stepBox').innerHTML='';
  el('stepBtn').classList.toggle('hidden',!q.passos?.length);
  el('stepBtn').disabled=false;
  el('stepBtn').textContent='🧩 Quebrar em partes';
  iniciarRelogio();
  show('quiz');
}

/* 1º toque escolhe, 2º confirma — evita o clique impulsivo */
function select(i){
  marcarPrimeiroToque();
  chosen=i;
  [...el('opts').children].forEach((b,j)=>b.classList.toggle('chosen',j===i));
  const c=el('confirmBtn');c.classList.remove('hidden');c.textContent=`Confirmar ${'ABCD'[i]}`;
}
el('confirmBtn').onclick=()=>{if(chosen!==null)answer(chosen);};

/* andaime: revela uma etapa por vez */
el('stepBtn').onclick=()=>{
  const p=missoes[S.mod].questoes[S.q].passos;if(!p?.length)return;
  marcarPrimeiroToque();
  el('stepBox').className='stepbox show';
  stepsShown++;
  el('stepBox').innerHTML=p.slice(0,stepsShown).map((t,i)=>`<div class="stepline"><b>Passo ${i+1}</b> · ${t}</div>`).join('');
  el('stepBtn').textContent = stepsShown>=p.length?'Todas as partes à mostra':'🧩 Mostrar a próxima parte';
  if(stepsShown>=p.length)el('stepBtn').disabled=true;
};

el('hintBtn').onclick=()=>{
  const q=missoes[S.mod].questoes[S.q];S.usedHint=true;marcarPrimeiroToque();
  el('hintBox').className='hintbox show';el('hintBox').innerHTML=`<b>Dica:</b> ${q.dica}`;
  el('hintBtn').classList.add('hidden');};

const PRAISE=['Boa! 🎯','Isso aí! ✨','Mandou bem! 🚀','Exatamente! 💚','Perfeito! ⭐','Você pegou o jeito! 🔥'];

function answer(choice){
  const m=missoes[S.mod],q=m.questoes[S.q],ok=choice===q.correta;
  const fb=el('feedback');
  el('confirmBtn').classList.add('hidden');

  /* 2ª CHANCE: no primeiro erro não revelamos nada — ela tenta de novo */
  if(!ok && attempts===0){
    attempts=1;chosen=null;
    [...el('opts').children].forEach((b,i)=>{
      b.classList.remove('chosen');
      if(i===choice){b.disabled=true;b.classList.add('wrong','dim');}
    });
    fb.className='feedback no show';
    fb.innerHTML=`<strong>Não foi essa — mas você ainda tem uma tentativa 💪</strong>
      Eliminei a alternativa ${'ABCD'[choice]}. Releia o enunciado devagar${q.passos?.length?' ou use o 🧩 para quebrar em partes':''} e escolha de novo.`;
    return;
  }

  [...el('opts').children].forEach((b,i)=>{b.disabled=true;b.classList.remove('chosen');
    if(i===q.correta)b.classList.add('correct');else if(i===choice)b.classList.add('wrong');else b.classList.add('dim');});
  el('hintBtn').classList.add('hidden');
  el('stepBtn').classList.add('hidden');
  el('stepBtn').disabled=false;

  let gained;
  if(ok){
    S.streak++;S.best=Math.max(S.best,S.streak);S.correctInMod=(S.correctInMod||0)+1;
    gained = attempts===1 ? 50 : (S.usedHint?60:100);
    const bonus=S.streak>=3?30:0;gained+=bonus;
    S.xp+=gained;
    fb.className='feedback ok show';
    fb.innerHTML=`<strong>${attempts===1?'Isso! Acertou na segunda 👏':PRAISE[Math.floor(Math.random()*PRAISE.length)]}</strong>${q.explicacao}
      <span class="xpop">+${gained} XP${bonus?` (incluindo +${bonus} de sequência 🔥)`:''}${S.usedHint&&attempts===0?' · usar dica é estratégia, não vergonha':''}</span>`;
    if(!S.focus&&(S.streak===3||S.streak===6))confetti(14);
  }else{
    gained=20;S.xp+=gained;
    S.errors.push({mod:m.titulo,q:q.enunciado.replace(/<\/?mark>|<\/?b>|<\/?i>/g,''),ans:q.alternativas[q.correta],why:q.explicacao});
    let shieldMsg='';
    if(S.shield){S.shield=false;shieldMsg='<br><b>🛡️ Escudo usado:</b> sua sequência de acertos continua de pé.';}
    else S.streak=0;
    fb.className='feedback no show';
    fb.innerHTML=`<strong>Ainda não — e agora você não erra mais essa</strong>Resposta certa: <b>${'ABCD'[q.correta]}) ${q.alternativas[q.correta]}</b><br>${q.explicacao}${shieldMsg}
      <span class="xpop">+${gained} XP por encarar o desafio até o fim</span>`;
  }
  /* A linha sai aqui, no desfecho da questão — nunca no meio da 2ª chance,
     senão a mesma questão viraria dois eventos. */
  registrarQuestao(m,q, ok ? (attempts===1?'acerto_2a':'acerto_1a') : 'erro');
  hud();save();
  el('nextBtn').classList.remove('hidden');el('nextBtn').focus();
}

el('nextBtn').onclick=()=>{
  const m=missoes[S.mod];
  if(S.q<m.questoes.length-1){S.q++;save();renderQ();}
  else finishModule();};

function finishModule(){
  const m=missoes[S.mod],c=S.correctInMod||0,n=m.questoes.length;
  const medal=c===n?'🥇':c>=n-1?'🥈':'🥉';
  S.done[m.missao_id]=medal;
  const bonus=c===n?150:c>=n-1?90:60;S.xp+=bonus;
  S.screen='map';save();hud();
  el('medalIcon').textContent=medal;
  el('doneTitle').textContent=`Missão "${m.titulo}" concluída!`;
  el('doneMsg').textContent = c===n?`${c} de ${n}. Esse tema você domina — pode marcar como resolvido.`
    : c>=n-1?`${c} de ${n}. Muito perto do topo: reveja a explicação da que escapou e refaça quando quiser.`
    : 'Missão cumprida. O importante é que agora você viu onde estava a pegadinha — refazer depois vale ouro.';
  el('doneXp').textContent=`+${bonus} XP de bônus de missão · total ${S.xp} XP`;
  /* Nenhuma linha de resumo aqui: acertos, medalha e tempo por missão se
     calculam na planilha a partir das linhas por questão. */
  offerPause(S.mod);
  if(!S.focus)confetti(c===3?40:20);
  show('moduleDone');
}

/* Pausa sugerida depois da 2ª e da 4ª missão — descanso, nunca cronômetro de tarefa */
function offerPause(modIdx){
  const area=el('pauseArea');area.innerHTML='';
  if(modIdx!==1&&modIdx!==3)return;
  area.innerHTML=`<div class="pausebox">
    <strong>Hora de esticar as pernas 🌿</strong>
    <span class="muted">Duas missões seguidas já é bastante. Cinco minutos longe da tela agora fazem o que você aprendeu grudar melhor — beba água, ande um pouco, olhe pela janela.</span>
    <div class="clock hidden" id="clock"></div>
    <div style="margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn small mint" id="pauseStart">Começar pausa de 5 min</button>
    </div></div>`;
  el('pauseStart').onclick=()=>{
    let t=300;const c=el('clock');c.classList.remove('hidden');
    el('pauseStart').classList.add('hidden');
    const tick=()=>{c.textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
      if(t--<=0){clearInterval(iv);c.textContent='Pronto! 🌟';
        c.insertAdjacentHTML('afterend','<p class="muted" style="margin-top:6px">Descanso feito. Quando quiser, siga para a próxima missão.</p>');}};
    tick();const iv=setInterval(tick,1000);
  };
}
el('backToMap').onclick=()=>{
  descartarParcial();save();          // missão concluída: não deixa resto de posição para trás
  if(missoes.every(x=>S.done[x.missao_id]))showFinal();else drawMap();};

function showFinal(){
  el('finalXp').textContent=`${S.xp} XP`;
  el('finalMsg').textContent=`Nível ${levelOf(S.xp)+1} · ${LEVELS[levelOf(S.xp)][1]} · maior sequência de acertos: ${S.best}. Você atravessou os ${N_MISSOES} temas da prova, com ferramenta e explicação em cada um.`;
  const uniq=[];S.errors.forEach(e=>{if(!uniq.find(u=>u.q===e.q))uniq.push(e);});
  el('finalReview').innerHTML = uniq.length
    ? `<h3>Vale reler antes da prova</h3>`+uniq.map(e=>`<div class="review-item"><b>${e.mod}</b><br>${e.q}<br><b>Resposta:</b> ${e.ans}<br>${e.why}</div>`).join('')
    : `<div class="lesson-box"><strong>Nenhum erro para revisar</strong> Você acertou tudo de primeira. Impressionante.</div>`;
  /* Idem: sem linha "jornada-completa". Um resumo não se desagrega depois. */
  el('finalReview').insertAdjacentHTML('beforeend',
    '<div class="center" style="margin-top:14px"><button class="btn ghost small" id="copyBtn">📋 Copiar resultados</button></div>');
  el('copyBtn').onclick=copiarResultados;
  if(!S.focus)confetti(60);show('final');
}

el('restartBtn').onclick=()=>reset();
el('resetBtn').onclick=()=>{if(confirm('Isso apaga o XP e as medalhas. Recomeçar do zero?'))reset();};
function reset(){const f=S.focus;
  S={xp:0,streak:0,best:0,done:{},screen:'map',mod:0,q:0,usedHint:false,errors:[],unlocked:1,focus:f,shield:true};
  store.clear();hud();applyFocus();drawMap();}

function confetti(n){
  if(S.focus)return;
  const cs=['#2fae94','#f2604c','#ffc857','#7a6cf0'];
  for(let i=0;i<n;i++){const d=document.createElement('div');d.className='confetti';
    d.style.left=Math.random()*100+'vw';d.style.background=cs[i%4];
    d.style.animationDuration=(1.6+Math.random()*1.4)+'s';d.style.animationDelay=(Math.random()*.4)+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),3400);}
}

/* ---------- retomar de onde parou ---------- */
(async()=>{
  rotulos();
  const s=await store.load();
  let carregado=false;
  if(s&&typeof s.xp==='number'){
    S={...S,...s};S.retomou=true;
    // retoma pelo missao_id, nunca pelo índice: a ordem das missões muda entre provas
    if(S.modId){const k=missoes.findIndex(x=>x.missao_id===S.modId);if(k>=0)S.mod=k;else S.screen='map';}
    else if(S.screen!=='map')S.screen='map';
    carregado=true;
  }
  hud();applyFocus();
  /* Identificar quem está estudando vem antes de qualquer coisa: uma linha
     gravada no nome errado é pior que linha nenhuma. */
  if(!alunaEscolhida()){ pedirAluna(()=>{esvaziarFila();entrarNoMapa(carregado);}); return; }
  /* A fila é drenada em toda abertura, inclusive quando ela está retomando.
     Antes só esvaziava no começo do zero, e uma sessão retomada segurava as
     linhas indefinidamente. */
  esvaziarFila();
  entrarNoMapa(carregado);
})();

function entrarNoMapa(carregado){
  if(carregado){
    if(missoes.every(x=>S.done[x.missao_id])){drawMap();return;}
    /* Parou no meio de uma missão? O parcial é descartado — ela recomeça pela
       aula. XP, medalhas e modo foco continuam sobrevivendo a fechar a aba;
       o que não sobrevive é a posição dentro de uma missão inacabada. */
    if((S.screen==='quiz'||S.screen==='lesson')&&missoes[S.mod]){
      const parada=missoes[S.mod].titulo;
      descartarParcial();save();drawMap();
      el('resumeNote').innerHTML=`Você tinha começado <b>${parada}</b>. É só tocar nela para fazer do início.`;
      return;
    }
    descartarParcial();
  }
  drawMap();
}
</script>
